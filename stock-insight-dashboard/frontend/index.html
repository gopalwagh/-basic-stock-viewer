<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Insight Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- loading page -->
  <div id="loader1">
    <h1>Loading...</h1>
    <div class="progress-box">
        <div class="progress-bar" id="bar"></div>
    </div>
    <p id="percent">0%</p>
  </div>

  <!-- main page -->
  <div id="main-page">
    <h1>📈 Stock Insight Dashboard</h1>

    <div class="input-box">
      <input
        type="text"
        id="symbolInput"
        placeholder="Enter stock symbol (e.g. TCS)"
      />
      <button id="analyzeBtn" type="button">Analyze</button>
    </div>

    <div id="status"></div>
    <!-- cicular loading -->
    <div id="loader">
      <div class="ring"></div>
      <div class="loader-text">Analyzing Market Data</div>
    </div>
    

    <div id="charts">
      <h2>Price Chart</h2>
      <img id="priceChart" alt="Stock Price Chart" />

      <h2>Volume Chart</h2>
      <img id="volumeChart" class="volumeChart" alt="Stock Volume Chart" />
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
